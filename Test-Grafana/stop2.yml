---
- hosts: ec2_instances
  remote_user: "{{ansible_ssh_user}}"
  become: true
  become_method: sudo

  tasks:
    - name: Stop grafana
      docker_container:
        name: grafana
        state: stopped
      ignore_errors: yes
    
    - name: Stop prometheus
      docker_container:
        name: prometheus
        state: stopped
      ignore_errors: yes
      